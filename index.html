<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopEase</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="header-content">
        <span id="moreBtn">≡</span>
        <div class="logo-box">
          <span id="logo"><a href="#home">🛍️ ShopEase</a></span>
        </div>
        <nav class="nav-bar">
          <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#products">Products</a></li>
          </ul>
          <button id="cartBtn"><span class="cart-btn">Cart 🛒</span></button>
        </nav>
      </div>
    </header>
    
    <main>
      <section class="heading-search-section" id="home">
        <div class="heading-box">
          <h1>Discover Products</h1>
          <p>Find exactly what you're looking for</p>
        </div>

        <div class="search-box">
          <input
            type="text"
            placeholder="Search products..."
            id="searchInput"
          />
          <button id="searchBtn">Search</button>
        </div>
      </section>

      <section class="filter-section">
        <h2>Filter Products</h2>

        <div class="filter-container">
          <div class="category-box">
            <h3>Category</h3>

            <select id="categorySelect">
              <option id="allOpt">All Products</option>
              <option id="electronicsOpt">Electronics</option>
              <option id="clothingOpt">Clothing</option>
              <option id="shoesOpt">Shoes</option>
              <option id="accessoriesOpt">Accessories</option>
            </select>
          </div>

          <div class="price-box">
            <h3>Price</h3>

            <div class="price-box-content">
              <span id="lowerPrice">₹0</span>

              <div class="slider">
                <input
                  type="range"
                  id="priceSlider"
                  min="0"
                  max="5000"
                  value="5000"
                />
              </div>

              <span id="higherPrice">₹5000</span>
            </div>
          </div>

          <div class="sort-box">
            <h3>Sort</h3>

            <select id="sortSelect">
              <option id="default">Default</option>
              <option id="lowToHigh">Price: Low to High</option>
              <option id="highToLow">Price: High to Low</option>
              <option id="aToZ">Name: A-Z</option>
            </select>
          </div>
        </div>

        <div class="select-category-products">
          <button id="all" class="button-active">All</button>
          <button id="electronics">Electronics</button>
          <button id="clothing">Clothing</button>
          <button id="shoes">Shoes</button>
          <button id="accessories">Accessories</button>
        </div>
      </section>

      <section class="product-section" id="products">
        <h2 id="productsCount">12 Products Found</h2>

        <div class="product-container">
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
